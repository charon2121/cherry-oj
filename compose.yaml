name: cherry-oj-engine

services:
  judge:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    image: cherry-oj-judge:local
    build:
      context: ./apps/judge-engine
      dockerfile: Dockerfile
      target: judge
    init: true
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      CHERRY_OJ_LOGGING_PATH: /var/log/cherry-oj
      CHERRY_OJ_LOGGING_LEVEL: ${ENGINE_LOG_LEVEL:-INFO}
      CHERRY_OJ_JUDGE_HTTP_ADDR: 0.0.0.0:5051
      # 此 Compose 仅用于可信代码开发；不可信执行使用 deploy/sandbox-linux 原生隔离部署。
      # devhost 是零隔离的开发后端：只用于可信代码的本地联调，不能跑用户提交。
      # 它要求显式承认，避免误用时以为自己有沙箱。正式隔离部署见 deploy/sandbox-linux。
      CHERRY_OJ_EXECUTION_BACKEND: devhost
      CHERRY_OJ_EXECUTION_ALLOW_UNSAFE_BACKEND: "true"
      CHERRY_OJ_EXECUTION_PARALLELISM: ${SANDBOX_PARALLELISM:-2}
      CHERRY_OJ_EXECUTION_STORE_ROOT: /var/lib/cherry-oj/store
      CHERRY_OJ_EXECUTION_STORE_MAX_BLOB_BYTES: ${SANDBOX_MAX_BLOB_BYTES:-67108864}
      # 测试数据按协议（docs/testdata-protocol.md）由请求里的地址读取；这里只是本地副本的工作目录。
      CHERRY_OJ_JUDGE_TESTDATA_WORK_ROOT: /var/lib/cherry-oj/testdata
      CHERRY_OJ_JUDGE_STRICT_WHITESPACE: ${JUDGE_STRICT_WHITESPACE:-false}
      CHERRY_OJ_JUDGE_REVEAL_EXPECTED: ${JUDGE_REVEAL_EXPECTED:-false}
      CHERRY_OJ_JUDGE_NODE_ENABLED: "true"
      CHERRY_OJ_JUDGE_NODE_ID: ${JUDGE_NODE_ID:-judge-local-1}
      CHERRY_OJ_JUDGE_NODE_CONTROL_PLANE_URL: ${JUDGE_CONTROL_PLANE_URL:-http://host.docker.internal:8084}
      CHERRY_OJ_JUDGE_NODE_ADVERTISE_URL: ${JUDGE_ADVERTISE_URL:-http://127.0.0.1:5051}
      CHERRY_OJ_JUDGE_NODE_CONTROL_TOKEN: ${CHERRY_JUDGE_CONTROL_TOKEN:-local-judge-control-token}
      CHERRY_OJ_JUDGE_NODE_HEARTBEAT_INTERVAL: ${JUDGE_HEARTBEAT_INTERVAL:-10s}
    ports:
      # MVP 先只开放给本机 server / curl；生产部署应移除端口映射并接入后端私网。
      - "${JUDGE_BIND_ADDRESS:-127.0.0.1}:${JUDGE_PORT:-5051}:5051"
    volumes:
      - engine-logs:/var/log/cherry-oj
      # 测试数据的本地副本：每次判题复制一份，判完删除，启动时清空遗留。
      - judge-testdata:/var/lib/cherry-oj/testdata
      # problem-service 写出的测试数据目录，按**同一个绝对路径**只读挂进来：题目上记的是宿主机上的绝对路径，
      # judge 容器里必须能用同一个路径读到。
      - type: bind
        source: ${PROBLEM_TESTDATA_ROOT:?set PROBLEM_TESTDATA_ROOT to the absolute directory problem-service writes test data to}
        target: ${PROBLEM_TESTDATA_ROOT}
        read_only: true
    tmpfs:
      # store 只放跨多次执行使用的临时 ref；容器停止后自动清空，且不需要执行权限。
      - /var/lib/cherry-oj/store:rw,nosuid,nodev,noexec,size=${SANDBOX_STORE_SIZE:-256m},mode=0700,uid=10001,gid=10001
      # devhost 的工作目录在 /tmp，编译产物会从这里执行，因此不能挂 noexec。
      - /tmp:rw,nosuid,nodev,exec,size=${SANDBOX_WORKSPACE_SIZE:-1g},mode=1777
    # judge 与执行层在同一个容器里：配额按两者之和给。
    cpus: ${JUDGE_CPUS:-3.0}
    mem_limit: ${JUDGE_MEMORY_LIMIT:-2560m}
    pids_limit: ${JUDGE_PIDS_LIMIT:-640}
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:5051/version"]
      interval: 5s
      timeout: 2s
      retries: 12
      start_period: 5s
    stop_grace_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    # judge 的北向入口；后续 apps/server 接入此网络。

volumes:
  engine-logs:
  judge-testdata:
    name: ${JUDGE_TESTDATA_VOLUME:-${COMPOSE_PROJECT_NAME}_judge-testdata}
