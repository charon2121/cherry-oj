<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">

</head><body><div class="wrap" style="display:flex;gap:24px;align-items:flex-end">

<div><div style="font-size:52px;font-weight:510;color:var(--meta);font-feature-settings:normal">agile 1234</div><div class="mono" style="margin-top:6px">default — do not ship</div></div>
