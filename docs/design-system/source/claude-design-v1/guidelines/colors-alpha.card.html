<!-- @dsCard group="Colors" viewport="700x140" name="Translucent fills" subtitle="Elevation by white opacity, not by shadow" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--fg-2);font-family:var(--font-body);font-feature-settings:var(--font-features);-webkit-font-smoothing:antialiased}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.wrap{padding:18px 24px}.lab{font-size:10px;font-weight:510;color:var(--meta);letter-spacing:.06em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:10px;color:var(--meta)}</style>
</head><body><div class="wrap" style="display:flex;gap:10px">
<div style="flex:1"><div style="height:60px;border-radius:8px;background:var(--surface-alpha-1);border:1px solid var(--border)"></div><div class="mono" style="margin-top:6px">0.02 · card rest</div></div>
<div style="flex:1"><div style="height:60px;border-radius:8px;background:var(--surface-alpha-2);border:1px solid var(--border)"></div><div class="mono" style="margin-top:6px">0.04 · card hover</div></div>
<div style="flex:1"><div style="height:60px;border-radius:8px;background:var(--surface-alpha-3);border:1px solid var(--border)"></div><div class="mono" style="margin-top:6px">0.05 · pressed / badge</div></div>
<div style="flex:1"><div style="height:60px;border-radius:8px;background:var(--accent-tint);border:1px solid rgba(210,4,45,.35)"></div><div class="mono" style="margin-top:6px">--accent-tint</div></div>
</div></body></html>
