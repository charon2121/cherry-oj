<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Ring, raised, inset, dialog — luminance first, shadow second" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--fg-2);font-family:var(--font-body);font-feature-settings:var(--font-features);-webkit-font-smoothing:antialiased}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.wrap{padding:18px 24px}.lab{font-size:10px;font-weight:510;color:var(--meta);letter-spacing:.06em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:10px;color:var(--meta)}</style>
</head><body><div class="wrap" style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px">
<div><div style="height:64px;border-radius:8px;background:var(--surface-alpha-1);box-shadow:var(--elev-ring)"></div><div class="mono" style="margin-top:6px">--elev-ring</div></div>
<div><div style="height:64px;border-radius:8px;background:var(--surface);box-shadow:var(--elev-raised)"></div><div class="mono" style="margin-top:6px">--elev-raised</div></div>
<div><div style="height:64px;border-radius:8px;background:var(--surface-panel);box-shadow:var(--elev-inset)"></div><div class="mono" style="margin-top:6px">--elev-inset</div></div>
<div><div style="height:64px;border-radius:12px;background:var(--surface);box-shadow:var(--elev-dialog);border:1px solid var(--border)"></div><div class="mono" style="margin-top:6px">--elev-dialog</div></div>
</div></body></html>
