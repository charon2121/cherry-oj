<!-- @dsCard group="Colors" viewport="700x170" name="Borders & lines" subtitle="Semi-transparent white hairlines do the structural work" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--fg-2);font-family:var(--font-body);font-feature-settings:var(--font-features);-webkit-font-smoothing:antialiased}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.wrap{padding:18px 24px}.lab{font-size:10px;font-weight:510;color:var(--meta);letter-spacing:.06em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:10px;color:var(--meta)}</style>
</head><body><div class="wrap" style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
<div style="height:64px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid var(--border-soft)"></div>
<div style="height:64px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid var(--border)"></div>
<div style="height:64px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid var(--border-solid)"></div>
<div style="height:64px;border-radius:8px;background:rgba(255,255,255,.02);border:1px solid var(--border-solid-3)"></div>
<div class="mono">--border-soft<br>rgba(255,255,255,.05)</div>
<div class="mono">--border<br>rgba(255,255,255,.08)</div>
<div class="mono">--border-solid<br>#23252a</div>
<div class="mono">--border-solid-3<br>#3e3e44</div>
</div></body></html>
