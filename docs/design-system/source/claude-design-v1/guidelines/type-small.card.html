<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--fg-2);font-family:var(--font-body);font-feature-settings:var(--font-features);-webkit-font-smoothing:antialiased}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.wrap{padding:18px 24px}.lab{font-size:10px;font-weight:510;color:var(--meta);letter-spacing:.06em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:10px;color:var(--meta)}</style>
</head><body><div class="wrap" style="display:flex;flex-direction:column;gap:9px">
<span style="font-size:13px;letter-spacing:-.01em;color:var(--meta)">Caption 13px — updated 4 minutes ago</span>
<span style="font-size:12px;font-weight:510;color:var(--fg-2)">Label 12px / 510 — button and chip text</span>
<span style="font-size:11px;font-weight:510;color:var(--muted)">Micro 11px / 510 — sidebar section titles</span>
<span style="font-size:10px;font-weight:510;letter-spacing:.08em;text-transform:uppercase;color:var(--meta)">Overline 10px uppercase 0.08em</span>
</div></body></html>
