<!-- @dsCard group="Colors" viewport="700x150" name="Cherry accent" subtitle="The one chromatic family — replaces the source system's indigo-violet" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--fg-2);font-family:var(--font-body);font-feature-settings:var(--font-features);-webkit-font-smoothing:antialiased}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.wrap{padding:18px 24px}.lab{font-size:10px;font-weight:510;color:var(--meta);letter-spacing:.06em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:10px;color:var(--meta)}</style>
</head><body><div class="wrap" style="display:flex;gap:10px">
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;border-radius:6px;background:var(--cherry-700);border:1px solid var(--border-soft)"></div><div class="lab">700 · deep</div><div class="mono">#7d0219</div></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;border-radius:6px;background:var(--cherry-600);border:1px solid var(--border-soft)"></div><div class="lab">600 · pressed</div><div class="mono">#a80324</div></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;border-radius:6px;background:var(--cherry-500);border:1px solid var(--border-soft)"></div><div class="lab">500 · brand</div><div class="mono">#d2042d</div></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;border-radius:6px;background:var(--cherry-400);border:1px solid var(--border-soft)"></div><div class="lab">400 · interactive</div><div class="mono">#ff4d67</div></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;border-radius:6px;background:var(--cherry-300);border:1px solid var(--border-soft)"></div><div class="lab">300 · hover</div><div class="mono">#ff7088</div></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;border-radius:6px;background:var(--cherry-muted);border:1px solid var(--border-soft)"></div><div class="lab">muted</div><div class="mono">#ad7a85</div></div>
</div></body></html>
