<!-- @dsCard group="Spacing" viewport="700x140" name="Focus & motion" subtitle="Cherry focus ring; 150/200ms with cubic-bezier(.2,0,0,1)" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--fg-2);font-family:var(--font-body);font-feature-settings:var(--font-features);-webkit-font-smoothing:antialiased}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.wrap{padding:18px 24px}.lab{font-size:10px;font-weight:510;color:var(--meta);letter-spacing:.06em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:10px;color:var(--meta)}</style>
</head><body><div class="wrap" style="display:flex;align-items:center;gap:18px">
<button style="background:var(--accent);color:#fff;border:1px solid transparent;border-radius:6px;padding:8px 16px;font:510 14px var(--font-display);box-shadow:var(--focus-ring)">Focused</button>
<input value="Focused field" style="background:rgba(255,255,255,.02);color:var(--fg-2);border:1px solid var(--accent);border-radius:6px;padding:10px 14px;font:400 14px var(--font-body);outline:none">
<div class="mono">--focus-ring · --motion-fast 150ms · --motion-base 200ms<br>--ease-standard cubic-bezier(.2,0,0,1)</div>
</div></body></html>
