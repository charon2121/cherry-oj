<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--fg-2);font-family:var(--font-body);font-feature-settings:var(--font-features);-webkit-font-smoothing:antialiased}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.wrap{padding:18px 24px}.lab{font-size:10px;font-weight:510;color:var(--meta);letter-spacing:.06em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:10px;color:var(--meta)}</style>
</head><body><div class="wrap" style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;gap:12px;align-items:flex-start"><span style="color:var(--success);font-size:13px;font-weight:510;width:26px">Do</span><span style="font-size:15px;color:var(--fg-2);letter-spacing:-.009em">Your submission ran in 42 ms. Two test cases remain.</span></div>
<div style="display:flex;gap:12px;align-items:flex-start"><span style="color:var(--success);font-size:13px;font-weight:510;width:26px">Do</span><span style="font-size:15px;color:var(--fg-2);letter-spacing:-.009em">Start building</span></div>
<div style="display:flex;gap:12px;align-items:flex-start"><span style="color:var(--danger);font-size:13px;font-weight:510;width:26px">No</span><span style="font-size:15px;color:var(--meta);letter-spacing:-.009em">🎉 Awesome job! You&rsquo;re crushing it!!</span></div>
<div style="display:flex;gap:12px;align-items:flex-start"><span style="color:var(--danger);font-size:13px;font-weight:510;width:26px">No</span><span style="font-size:15px;color:var(--meta);letter-spacing:-.009em">Get Started Now — Unlock Your Potential</span></div>
</div></body></html>
