<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--fg-2);font-family:var(--font-body);font-feature-settings:var(--font-features);-webkit-font-smoothing:antialiased}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.wrap{padding:18px 24px}.lab{font-size:10px;font-weight:510;color:var(--meta);letter-spacing:.06em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:10px;color:var(--meta)}</style>
</head><body><div class="wrap" style="display:flex;flex-direction:column;gap:10px">
<p style="margin:0;font-size:18px;line-height:1.6;letter-spacing:-.009em;color:var(--muted)">Lead — 18px / 1.6 / --muted. Sits under a display headline and carries the promise.</p>
<p style="margin:0;font-size:16px;line-height:1.5;color:var(--fg-2)">Body — 16px / 1.5 / --fg-2. The default reading size for prose blocks.</p>
<p style="margin:0;font-size:15px;line-height:1.6;letter-spacing:-.009em;color:var(--muted)">Small — 15px / 1.6. Card copy and secondary descriptions.</p>
<p style="margin:0;font-size:14px;line-height:1.5;color:var(--fg-2);font-weight:510">UI — 14px / 510. Buttons, labels, list rows.</p>
</div></body></html>
