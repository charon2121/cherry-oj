<!-- @dsCard group="Colors" viewport="700x150" name="Text tones" subtitle="Four-step foreground hierarchy, never pure white" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--fg-2);font-family:var(--font-body);font-feature-settings:var(--font-features);-webkit-font-smoothing:antialiased}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.wrap{padding:18px 24px}.lab{font-size:10px;font-weight:510;color:var(--meta);letter-spacing:.06em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:10px;color:var(--meta)}</style>
</head><body><div class="wrap" style="display:flex;flex-direction:column;gap:10px">
<div style="display:flex;align-items:baseline;gap:14px"><span style="color:var(--fg);font-size:20px;font-weight:510;width:150px">Primary</span><span class="mono">--fg · #f7f8f8</span><span class="lab">headings, active rows</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span style="color:var(--fg-2);font-size:20px;width:150px">Body</span><span class="mono">--fg-2 · #d0d6e0</span><span class="lab">running copy, labels</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span style="color:var(--muted);font-size:20px;width:150px">Muted</span><span class="mono">--muted · #8a8f98</span><span class="lab">leads, placeholders</span></div>
<div style="display:flex;align-items:baseline;gap:14px"><span style="color:var(--meta);font-size:20px;width:150px">Meta</span><span class="mono">--meta · #62666d</span><span class="lab">timestamps, disabled</span></div>
</div></body></html>
