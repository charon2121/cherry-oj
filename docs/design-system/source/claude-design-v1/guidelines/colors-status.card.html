<!-- @dsCard group="Colors" viewport="700x140" name="Status" subtitle="Greens carried over from the source; danger sits close to cherry — pair with an icon" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--fg-2);font-family:var(--font-body);font-feature-settings:var(--font-features);-webkit-font-smoothing:antialiased}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.wrap{padding:18px 24px}.lab{font-size:10px;font-weight:510;color:var(--meta);letter-spacing:.06em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:10px;color:var(--meta)}</style>
</head><body><div class="wrap" style="display:flex;gap:10px">
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;border-radius:6px;background:var(--success);border:1px solid var(--border-soft)"></div><div class="lab">success</div><div class="mono">#27a644</div></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;border-radius:6px;background:var(--emerald);border:1px solid var(--border-soft)"></div><div class="lab">emerald</div><div class="mono">#10b981</div></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;border-radius:6px;background:var(--warn);border:1px solid var(--border-soft)"></div><div class="lab">warn</div><div class="mono">#eab308</div></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;border-radius:6px;background:var(--danger);border:1px solid var(--border-soft)"></div><div class="lab">danger</div><div class="mono">#dc2626</div></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;border-radius:6px;background:var(--accent);border:1px solid var(--border-soft)"></div><div class="lab">accent</div><div class="mono">#d2042d</div></div>
</div></body></html>
