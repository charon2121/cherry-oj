<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Luminance ladder — deepest canvas to elevated surface" -->
<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;background:var(--bg);color:var(--fg-2);font-family:var(--font-body);font-feature-settings:var(--font-features);-webkit-font-smoothing:antialiased}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.wrap{padding:18px 24px}.lab{font-size:10px;font-weight:510;color:var(--meta);letter-spacing:.06em;text-transform:uppercase}.mono{font-family:var(--font-mono);font-size:10px;color:var(--meta)}</style>
</head><body><div class="wrap" style="display:flex;gap:10px">
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;border-radius:6px;background:var(--bg-deep);border:1px solid var(--border-soft)"></div><div class="lab">bg-deep</div><div class="mono">#010102</div></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;border-radius:6px;background:var(--bg);border:1px solid var(--border-soft)"></div><div class="lab">bg</div><div class="mono">#08090a</div></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;border-radius:6px;background:var(--surface-panel);border:1px solid var(--border-soft)"></div><div class="lab">surface-panel</div><div class="mono">#0f1011</div></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;border-radius:6px;background:var(--surface);border:1px solid var(--border-soft)"></div><div class="lab">surface</div><div class="mono">#191a1b</div></div>
<div style="display:flex;flex-direction:column;gap:6px;flex:1"><div style="height:56px;border-radius:6px;background:var(--surface-2);border:1px solid var(--border-soft)"></div><div class="lab">surface-2</div><div class="mono">#28282c</div></div>
</div></body></html>
