<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cherry OJ — marketing site</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--fg-2);font-family:var(--font-body);font-size:var(--text-base);line-height:var(--leading-body);font-feature-settings:var(--font-features);-webkit-font-smoothing:antialiased}a{color:var(--text-link);text-decoration:none}a:hover{color:var(--text-link-hover)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="Icons.jsx"></script>
<script type="text/babel" src="Hero.jsx"></script>
<script type="text/babel" src="Features.jsx"></script>
<script type="text/babel" src="SignupSection.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel">
const { NavBar, Button } = window.CherryOJDesignSystem_51433c;
function Site() {
  const [page, setPage] = React.useState('/p');
  const signupRef = React.useRef(null);
  const goSignup = () => signupRef.current && window.scrollTo({ top: signupRef.current.offsetTop - 80, behavior: 'smooth' });
  return (
    <div>
      <NavBar
        brand="Cherry OJ"
        links={[
          {label:'Problems', href:'/p', onClick:(e)=>{e.preventDefault();setPage('/p');}},
          {label:'Contests', href:'/c', onClick:(e)=>{e.preventDefault();setPage('/c');}},
          {label:'Docs', href:'/d', onClick:(e)=>{e.preventDefault();setPage('/d');}},
          {label:'Changelog', href:'/l', onClick:(e)=>{e.preventDefault();setPage('/l');}},
        ]}
        activeHref={page}
        secondary={<Button variant="ghost" size="sm">Log in</Button>}
        cta={<Button size="sm" onClick={goSignup}>Sign up</Button>}
      />
      <main>
        <Hero onSignup={goSignup} />
        <Features />
        <div ref={signupRef}><SignupSection /></div>
        <Footer />
      </main>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Site />);
</script>
</body></html>
