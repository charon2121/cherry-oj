# Tests never implicitly select the private developer profile, including IDE runs.
spring.profiles.default=test
# 仅供测试的服务密钥，来自 identity-token-support 的 test-jar。
cherry.service-identity.private-key-location=classpath:test-service-identity/gateway-service-private.pem
cherry.service-identity.public-keys-dir=classpath:test-service-identity
