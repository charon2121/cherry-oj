spring:
  application:
    name: gateway-service
  webflux:
    multipart:
      max-in-memory-size: 1MB
      max-headers-size: 16KB
      max-parts: 1
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration
  data:
    redis:
      host: "${CHERRY_REDIS_HOST:127.0.0.1}"
      port: "${CHERRY_REDIS_PORT:6379}"
      password: "${CHERRY_REDIS_PASSWORD:}"
      timeout: 2s
server:
  port: 8080
  reactive:
    session:
      cookie:
        name: CHERRY_SESSION
        http-only: true
        secure: "${CHERRY_SESSION_SECURE:false}"
        same-site: lax
        path: /api

cherry:
  gateway:
    user-service-base-url: "${CHERRY_USER_SERVICE_URL:http://127.0.0.1:8081}"
    user-service-timeout: 5s
    session-lifetime-policy: fixed-absolute
    session-absolute-timeout-seconds: "${CHERRY_AUTH_SESSION_ABSOLUTE_TIMEOUT_SECONDS:2592000}"
    access-token-ttl: 2h
    token-refresh-ahead: 5m
    trusted-origins:
      - "${CHERRY_WEB_ORIGIN:http://localhost:5173}"
    login-rate-limit-per-minute: 10
    problem-service:
      base-url: "${CHERRY_PROBLEM_SERVICE_URL:http://127.0.0.1:8082}"
      metadata-timeout: 10s
      streaming-timeout: 2m
      max-json-bytes: 33554432

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      produce: [w3c]
      # Gateway 是公开信任边界：忽略浏览器传入的 Trace，始终建立内部 root。
      consume: []
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,gatewayIdentity

logging:
  file:
    # 可用 CHERRY_LOG_PATH 覆盖；当前文件在午夜滚动为带 UTC 日期的归档文件。
    name: "${CHERRY_LOG_PATH:./logs}/${spring.application.name}.log"
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: "${spring.application.name}"
      exclude: ["@version", "level_value"]
      rename:
        logger_name: logger
        thread_name: thread
        traceId: trace_id
        spanId: span_id
      stacktrace:
        max-length: 8192
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd,UTC}.%i.gz"
      max-file-size: 10MB
      max-history: 30

---
spring:
  config:
    activate:
      on-profile: "prod | production"

server:
  reactive:
    session:
      cookie:
        secure: true
