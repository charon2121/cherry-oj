spring:
  application:
    name: gateway-service

server:
  port: 8080

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      produce: [w3c]
      # Gateway 是公开信任边界：忽略浏览器传入的 Trace，始终建立内部 root。
      consume: []
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  file:
    # 可用 CHERRY_LOG_PATH 覆盖；当前文件在午夜滚动为带 UTC 日期的归档文件。
    name: "${CHERRY_LOG_PATH:./logs}/${spring.application.name}.log"
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: "${spring.application.name}"
      exclude: ["@version", "level_value"]
      rename:
        logger_name: logger
        thread_name: thread
        traceId: trace_id
        spanId: span_id
      stacktrace:
        max-length: 8192
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd,UTC}.%i.gz"
      max-file-size: 10MB
      max-history: 30
