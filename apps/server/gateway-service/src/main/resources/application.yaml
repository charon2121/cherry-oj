# 通用配置；本地复制 application-local.example.yaml 后直接运行主类。
# 容器显式设置 SPRING_PROFILES_ACTIVE=dev/test/prod，通过环境变量覆盖。
spring:
  profiles:
    default: local
  application:
    name: gateway-service
  http:
    codecs:
      max-in-memory-size: 2MB
  webflux:
    multipart:
      max-in-memory-size: 1MB
      max-headers-size: 16KB
      max-parts: 1
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.ReactiveUserDetailsServiceAutoConfiguration
  data:
    redis:
      host: "${CHERRY_REDIS_HOST:127.0.0.1}"
      port: "${CHERRY_REDIS_PORT:6379}"
      password: "${CHERRY_REDIS_PASSWORD:}"
      timeout: 2s
server:
  port: "${CHERRY_GATEWAY_PORT:8080}"
  reactive:
    session:
      cookie:
        name: CHERRY_SESSION
        http-only: true
        secure: "${CHERRY_SESSION_SECURE:false}"
        same-site: lax
        path: /api

cherry:
  service-identity:
    name: "${spring.application.name}"
    private-key-location: "${CHERRY_SERVICE_PRIVATE_KEY_LOCATION:file:${CHERRY_SERVICE_IDENTITY_DIR:./service-identity}/${spring.application.name}-private.pem}"
    public-keys-dir: "${CHERRY_SERVICE_PUBLIC_KEYS_DIR:${CHERRY_SERVICE_IDENTITY_DIR:./service-identity}}"
  custom-run:
    enabled: ${CHERRY_CUSTOM_RUN_ENABLED:true}
  gateway:
    submission-service-url: "${CHERRY_SUBMISSION_SERVICE_URL:http://127.0.0.1:${CHERRY_SUBMISSION_PORT:8083}}"
    judging-service-url: "${CHERRY_JUDGING_SERVICE_URL:http://127.0.0.1:${CHERRY_JUDGING_PORT:8084}}"
    user-service-base-url: "${CHERRY_USER_SERVICE_URL:http://127.0.0.1:${CHERRY_USER_PORT:8081}}"
    user-service-timeout: 5s
    session-absolute-timeout-seconds: "${CHERRY_AUTH_SESSION_ABSOLUTE_TIMEOUT_SECONDS:2592000}"
    trusted-origins:
      - "${CHERRY_WEB_ORIGIN:http://cherry.localhost:${CHERRY_WEB_PORT:5173}}"
    login-rate-limit-per-minute: 10
    problem-service:
      base-url: "${CHERRY_PROBLEM_SERVICE_URL:http://127.0.0.1:${CHERRY_PROBLEM_PORT:8082}}"
      metadata-timeout: 10s
      streaming-timeout: 2m
      max-json-bytes: 33554432

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      produce: [w3c]
      # Gateway 是公开信任边界：忽略浏览器传入的 Trace，始终建立内部 root。
      consume: []
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState

logging:
  file:
    # 可用 CHERRY_LOG_PATH 覆盖；当前文件在午夜滚动为带 UTC 日期的归档文件。
    name: "${CHERRY_LOG_PATH:./logs}/${spring.application.name}.log"
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: "${spring.application.name}"
      exclude: ["@version", "level_value"]
      rename:
        logger_name: logger
        thread_name: thread
        traceId: trace_id
        spanId: span_id
      stacktrace:
        max-length: 8192
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd,UTC}.%i.gz"
      max-file-size: 10MB
      max-history: 30

---
spring:
  config:
    activate:
      on-profile: "prod | production"

server:
  reactive:
    session:
      cookie:
        secure: true
