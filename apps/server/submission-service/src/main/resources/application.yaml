spring:
  application:
    name: submission-service
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

cherry:
  identity:
    issuer: "${CHERRY_IDENTITY_ISSUER:cherry-oj-user-service}"
    audience: "${CHERRY_IDENTITY_AUDIENCE:cherry-oj-internal}"
    jwks-uri: "${CHERRY_IDENTITY_JWKS_URI:http://127.0.0.1:8081/.well-known/jwks.json}"
    metadata-uri: "${CHERRY_IDENTITY_METADATA_URI:http://127.0.0.1:8081/internal/identity/metadata}"
    access-token-ttl: 2h
    clock-skew: 30s
    connect-timeout: 2s
    read-timeout: 2s

server:
  port: 8083

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      produce: [w3c]
      consume: [w3c]
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,identityVerifierHealth
          show-details: always

logging:
  file:
    name: "${CHERRY_LOG_PATH:./logs}/${spring.application.name}.log"
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: "${spring.application.name}"
      exclude: ["@version", "level_value"]
      rename:
        logger_name: logger
        thread_name: thread
        traceId: trace_id
        spanId: span_id
      stacktrace:
        max-length: 8192
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd,UTC}.%i.gz"
      max-file-size: 10MB
      max-history: 30
