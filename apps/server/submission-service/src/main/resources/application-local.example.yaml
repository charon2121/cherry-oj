# 复制为 application-local.yaml，填写本地值。空凭据必须填写，不能直接运行。
# 服务之间的调用身份不在这里配置：scripts/dev-server.sh 会生成各服务的密钥（.local/service-identity/）。
spring:
  datasource:
    url: "jdbc:mysql://127.0.0.1:3306/cherry_oj_submission?serverTimezone=UTC"
    username: "cherry_oj_submission"
    password: ""
  kafka:
    bootstrap-servers: "127.0.0.1:9092"
cherry:
  submission:
    messaging-enabled: "false"
    accepting: "false"
    problem-url: "http://127.0.0.1:${CHERRY_PROBLEM_PORT:8082}"
    judging-url: "http://127.0.0.1:${CHERRY_JUDGING_PORT:8084}"
