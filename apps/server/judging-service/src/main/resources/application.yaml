spring:
  application:
    name: judging-service
  kafka:
    bootstrap-servers: "${CHERRY_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.request.size: 1048576
        max.block.ms: 5000
        delivery.timeout.ms: 15000
        request.timeout.ms: 5000
    consumer:
      group-id: "${CHERRY_JUDGING_CONSUMER_GROUP:judging-requests-v1}"
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      enable-auto-commit: false
      auto-offset-reset: earliest
    listener:
      ack-mode: record
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: "${CHERRY_JUDGING_DB_URL:jdbc:mysql://127.0.0.1:3306/cherry_oj_judging?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}"
    username: "${CHERRY_JUDGING_DB_USERNAME:cherry_oj_judging}"
    password: "${CHERRY_JUDGING_DB_PASSWORD:K_9sF7pR2xQ8bT4vZ6n}"
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 102MB

cherry:
  service-calls:
    submission-judging-tokens: "${CHERRY_SUBMISSION_JUDGING_TOKENS:}"
  formal:
    enabled: "${CHERRY_FORMAL_JUDGING_ENABLED:false}"
    requests-topic: "${CHERRY_JUDGE_REQUESTS_TOPIC:judge.requests.v1}"
    lifecycle-topic: "${CHERRY_JUDGE_LIFECYCLE_TOPIC:judge.lifecycle.v1}"
    submission-url: "${CHERRY_SUBMISSION_SERVICE_URL:http://127.0.0.1:8083}"
    submission-token: "${CHERRY_JUDGING_SUBMISSION_TOKEN:}"
    parallelism: 2
    max-attempts: 3
    lease-duration: 30s
    deadline: 10m
    compile-budget: 30s
    wall-ratio: 10
    case-overhead: 1s
  identity:
    issuer: "${CHERRY_IDENTITY_ISSUER:cherry-oj-user-service}"
    audience: "${CHERRY_IDENTITY_AUDIENCE:cherry-oj-internal}"
    jwks-uri: "${CHERRY_IDENTITY_JWKS_URI:http://127.0.0.1:8081/.well-known/jwks.json}"
    metadata-uri: "${CHERRY_IDENTITY_METADATA_URI:http://127.0.0.1:8081/internal/identity/metadata}"
    access-token-ttl: 2h
    clock-skew: 30s
    connect-timeout: 2s
    read-timeout: 2s
  judging:
    node:
      control-token: "${CHERRY_JUDGE_CONTROL_TOKEN:local-judge-control-token}"
      lease-duration: "${CHERRY_JUDGE_NODE_LEASE_DURATION:35s}"
      deployment-mode: "${CHERRY_JUDGE_DEPLOYMENT_MODE:node-remote}"
    testdata-root: "${CHERRY_JUDGE_TESTDATA_ROOT:./data/judge-testdata}"
    max-archive-bytes: 104857600
    max-expanded-bytes: 1073741824
    max-entry-bytes: 67108864
    max-files: 2000
    max-compression-ratio: 100
    judge-timeout: "${CHERRY_JUDGE_TIMEOUT:10m}"
    stale-age: "${CHERRY_JUDGE_DEPLOYMENT_STALE_AGE:24h}"
    recovery-enabled: true
    provision:
      enabled: false
      allow-existing-identical: false
      id: ""
      name: ""
      fingerprint: ""
      architecture: ""
      cpu-model: ""
      os-version: ""
      kernel-version: ""
      judge-version: ""
      sandbox-version: ""
      config-digest: ""
      endpoint-ref: ""
      language-id: "cpp"
      toolchain-version: ""
      language-config-digest: ""

server:
  port: 8084

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      produce: [w3c]
      consume: [w3c]
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,identityVerifierHealth
          show-details: always

logging:
  file:
    name: "${CHERRY_LOG_PATH:./logs}/${spring.application.name}.log"
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: "${spring.application.name}"
      exclude: ["@version", "level_value"]
      rename:
        logger_name: logger
        thread_name: thread
        traceId: trace_id
        spanId: span_id
      stacktrace:
        max-length: 8192
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd,UTC}.%i.gz"
      max-file-size: 10MB
      max-history: 30

---
spring:
  config:
    activate:
      on-profile: "prod | production"
  datasource:
    password: "${CHERRY_JUDGING_DB_PASSWORD}"

cherry:
  judging:
    node:
      control-token: "${CHERRY_JUDGE_CONTROL_TOKEN}"
