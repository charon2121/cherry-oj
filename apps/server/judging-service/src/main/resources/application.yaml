spring:
  application:
    name: judging-service
  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    url: "${CHERRY_JUDGING_DB_URL:jdbc:mysql://127.0.0.1:3306/cherry_oj_judging?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}"
    username: "${CHERRY_JUDGING_DB_USERNAME:cherry_oj_judging}"
    password: "${CHERRY_JUDGING_DB_PASSWORD:K_9sF7pR2xQ8bT4vZ6n}"
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 102MB

cherry:
  identity:
    issuer: "${CHERRY_IDENTITY_ISSUER:cherry-oj-user-service}"
    audience: "${CHERRY_IDENTITY_AUDIENCE:cherry-oj-internal}"
    jwks-uri: "${CHERRY_IDENTITY_JWKS_URI:http://127.0.0.1:8081/.well-known/jwks.json}"
    clock-skew: 30s
  judging:
    testdata-root: "${CHERRY_JUDGE_TESTDATA_ROOT:./data/judge-testdata}"
    max-archive-bytes: 104857600
    max-expanded-bytes: 1073741824
    max-entry-bytes: 67108864
    max-files: 2000
    max-compression-ratio: 100
    judge-timeout: "${CHERRY_JUDGE_TIMEOUT:10m}"
    stale-age: "${CHERRY_JUDGE_DEPLOYMENT_STALE_AGE:24h}"
    recovery-enabled: true
    provision:
      enabled: false
      allow-existing-identical: false
      id: ""
      name: ""
      fingerprint: ""
      architecture: ""
      cpu-model: ""
      os-version: ""
      kernel-version: ""
      judge-version: ""
      sandbox-version: ""
      config-digest: ""
      endpoint-ref: ""
      language-id: "cpp"
      toolchain-version: ""
      language-config-digest: ""

server:
  port: 8084

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      produce: [w3c]
      consume: [w3c]
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  file:
    name: "${CHERRY_LOG_PATH:./logs}/${spring.application.name}.log"
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: "${spring.application.name}"
      exclude: ["@version", "level_value"]
      rename:
        logger_name: logger
        thread_name: thread
        traceId: trace_id
        spanId: span_id
      stacktrace:
        max-length: 8192
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd,UTC}.%i.gz"
      max-file-size: 10MB
      max-history: 30

---
spring:
  config:
    activate:
      on-profile: "prod | production"
  datasource:
    password: "${CHERRY_JUDGING_DB_PASSWORD}"
