spring:
  application:
    name: user-service
  datasource:
    url: "${CHERRY_USER_DB_URL:jdbc:mysql://127.0.0.1:3306/cherry_oj_user}"
    username: "${CHERRY_USER_DB_USERNAME:cherry_oj_user}"
    password: "${CHERRY_USER_DB_PASSWORD:K_9sF7pR2xQ8bT4vZ6n}"
  flyway:
    enabled: true

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

cherry:
  auth:
    issuer: "${CHERRY_AUTH_ISSUER:cherry-oj-user-service}"
    audience: "${CHERRY_AUTH_AUDIENCE:cherry-oj-internal}"
    key-id: "${CHERRY_AUTH_KEY_ID:local-ephemeral}"
    private-key-location: "${CHERRY_AUTH_PRIVATE_KEY_LOCATION:generated:local}"
    public-key-location: "${CHERRY_AUTH_PUBLIC_KEY_LOCATION:generated:local}"
    access-token-ttl: 120s
    clock-skew: 30s
    session-idle-timeout-seconds: "${CHERRY_AUTH_SESSION_IDLE_TIMEOUT_SECONDS:1800}"
    session-absolute-timeout-seconds: "${CHERRY_AUTH_SESSION_ABSOLUTE_TIMEOUT_SECONDS:43200}"
    session-refresh-idle-on-activity: "${CHERRY_AUTH_SESSION_REFRESH_IDLE_ON_ACTIVITY:true}"

server:
  port: 8081

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      produce: [w3c]
      consume: [w3c]
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  file:
    name: "${CHERRY_LOG_PATH:./logs}/${spring.application.name}.log"
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: "${spring.application.name}"
      exclude: ["@version", "level_value"]
      rename:
        logger_name: logger
        thread_name: thread
        traceId: trace_id
        spanId: span_id
      stacktrace:
        max-length: 8192
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd,UTC}.%i.gz"
      max-file-size: 10MB
      max-history: 30

---
spring:
  config:
    activate:
      on-profile: "prod | production"
  datasource:
    password: "${CHERRY_USER_DB_PASSWORD}"

cherry:
  auth:
    key-id: "${CHERRY_AUTH_KEY_ID}"
    private-key-location: "${CHERRY_AUTH_PRIVATE_KEY_LOCATION}"
    public-key-location: "${CHERRY_AUTH_PUBLIC_KEY_LOCATION}"
