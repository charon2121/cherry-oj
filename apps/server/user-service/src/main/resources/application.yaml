# 通用配置；本地复制 application-local.example.yaml 后直接运行主类。
# 容器显式设置 SPRING_PROFILES_ACTIVE=dev/test/prod，通过环境变量覆盖。
spring:
  profiles:
    default: local
  application:
    name: user-service
  datasource:
    url: "${CHERRY_USER_DB_URL:jdbc:mysql://127.0.0.1:3306/cherry_oj_user}"
    username: "${CHERRY_USER_DB_USERNAME:cherry_oj_user}"
    password: "${CHERRY_USER_DB_PASSWORD}"
  flyway:
    enabled: true

mybatis:
  mapper-locations: classpath:/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

cherry:
  auth:
    mode: "${CHERRY_AUTH_MODE:server}"
    session-absolute-timeout-seconds: "${CHERRY_AUTH_SESSION_ABSOLUTE_TIMEOUT_SECONDS:2592000}"
  service-identity:
    name: "${spring.application.name}"
    private-key-location: "${CHERRY_SERVICE_PRIVATE_KEY_LOCATION:file:${CHERRY_SERVICE_IDENTITY_DIR:./service-identity}/${spring.application.name}-private.pem}"
    public-keys-dir: "${CHERRY_SERVICE_PUBLIC_KEYS_DIR:${CHERRY_SERVICE_IDENTITY_DIR:./service-identity}/public}"

server:
  port: "${CHERRY_USER_PORT:8081}"

management:
  tracing:
    sampling:
      probability: 1.0
    propagation:
      produce: [w3c]
      consume: [w3c]
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false
  logging:
    export:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState

logging:
  file:
    name: "${CHERRY_LOG_PATH:./logs}/${spring.application.name}.log"
  structured:
    format:
      console: logstash
      file: logstash
    json:
      add:
        service: "${spring.application.name}"
      exclude: ["@version", "level_value"]
      rename:
        logger_name: logger
        thread_name: thread
        traceId: trace_id
        spanId: span_id
      stacktrace:
        max-length: 8192
  logback:
    rollingpolicy:
      file-name-pattern: "${LOG_FILE}.%d{yyyy-MM-dd,UTC}.%i.gz"
      max-file-size: 10MB
      max-history: 30

---
spring:
  config:
    activate:
      on-profile: "prod | production"
  datasource:
    password: "${CHERRY_USER_DB_PASSWORD}"
