# Tests never implicitly select the private developer profile, including IDE runs.
spring.profiles.default=test
# 测试专用服务身份密钥（test-only-*.pem），只用于测试，与任何部署无关。
cherry.service-clients.gateway-service=classpath:service-identity/test-only-gateway-service-public.pem
cherry.service-clients.submission-service=classpath:service-identity/test-only-submission-service-public.pem
cherry.service-clients.judging-service=classpath:service-identity/test-only-judging-service-public.pem
