name: Business

# 完整业务链路：在一次性的 GitHub 托管虚拟机上用正式安装器装一个真实 Linux 判题节点，起 MySQL/Redis/Kafka、
# 五个 Java 服务与 Web，再用真实页面跑 apps/web/e2e-live（自测、Kafka 正式提交、历史回看）与校准、数据部署。
# 它改动这台虚拟机的用户、/etc、systemd 与 cgroup，只能在一次性机器上运行（见 deploy/sandbox-linux/ci/README.md）。
#
# 2026-10-06 精简日常 CI 时它从每次提交的门禁里移除；现在只按需手动触发，用于里程碑验收（如 MVP 收尾）。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  business:
    name: 业务闭环（真实页面、校准与 Kafka，Linux 原生节点）
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/judge-engine/go.mod
          cache-dependency-path: apps/judge-engine/go.sum
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: apps/server/**/pom.xml
          overwrite-settings: false

      - name: 安装执行器的编译依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libseccomp-dev

      # 锁定软件包只从 Ubuntu 快照取；缓存的字节只是输入，prepare.py 复制时仍按锁定的 SHA256 逐个校验。
      - name: 恢复锁定软件包缓存
        id: packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/packages
          key: rootfs-packages-${{ hashFiles('deploy/sandbox-linux/rootfs/ubuntu24-amd64-smoke.lock.json') }}
      - name: 下载锁定软件包
        if: steps.packages.outputs.cache-hit != 'true'
        run: >-
          python3 deploy/sandbox-linux/rootfs/download.py
          --lock deploy/sandbox-linux/rootfs/ubuntu24-amd64-smoke.lock.json
          --output "$RUNNER_TEMP/packages" --address-failover

      - name: 构建当前提交的 Linux 二进制与 rootfs
        run: python3 deploy/sandbox-linux/ci/prepare.py --output "$RUNNER_TEMP/sandbox-build" --packages "$RUNNER_TEMP/packages"
      - name: 构建真实 Java 服务与 Web 页面
        run: python3 deploy/sandbox-linux/ci/business_prepare.py --output "$RUNNER_TEMP/business-build"
      - name: 安装本轮 Chromium 与系统依赖
        working-directory: apps/web
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/business-browsers
        run: npx playwright install --with-deps chromium

      - name: 新环境、数据部署、独立校准与真实页面判题
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,ImageVersion,PYTHONDONTWRITEBYTECODE
          python3 deploy/sandbox-linux/ci/business.py
          --build "$RUNNER_TEMP/sandbox-build" --application-build "$RUNNER_TEMP/business-build"
          --java "$JAVA_HOME/bin/java" --node "$(command -v node)"
          --browsers "$RUNNER_TEMP/business-browsers" --output "$RUNNER_TEMP/sandbox-business"
      - name: 取消或失败后清理本轮完整栈
        if: always()
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,PYTHONDONTWRITEBYTECODE
          python3 deploy/sandbox-linux/ci/business.py --cleanup --output "$RUNNER_TEMP/sandbox-business"
      - name: 保存脱敏业务证据
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sandbox-business-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sandbox-business
          if-no-files-found: error
          retention-days: 14
      - name: 保存有界构建日志
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sandbox-business-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/business-build
            ${{ runner.temp }}/sandbox-build/logs
          if-no-files-found: error
          retention-days: 14
