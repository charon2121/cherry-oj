name: Sandbox executor

# C 版 sandbox 执行器只能在真实的 x86_64 Linux 内核上验证：namespace、cgroup v2、seccomp、
# 新挂载 API 与 openat2 都需要真内核。测试以 root 运行，会改动这台一次性虚拟机的用户、/etc 与 cgroup。
on:
  push:
    branches: [main]
    paths:
      - 'apps/sandbox/**'
      - '.github/workflows/sandbox-executor.yml'
  pull_request:
    paths:
      - 'apps/sandbox/**'
      - '.github/workflows/sandbox-executor.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-executor:
    name: sandbox 执行器（C，真实内核）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 安装编译依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libseccomp-dev
      - name: 构建执行器
        run: make -C apps/sandbox
      - name: 构建测试探针
        run: gcc -static -O2 -Wall -Werror -o apps/sandbox/build/probe apps/sandbox/tests/probe.c
      - name: 真实内核测试
        run: sudo python3 apps/sandbox/tests/run_tests.py --binary apps/sandbox/build/sandbox --probe apps/sandbox/build/probe
