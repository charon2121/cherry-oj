name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: 契约与文档
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 契约、文档校验器与记录工具测试
        run: python3 -m unittest discover -s scripts -p '*_test.py'
      - name: 文档链接与历史原件完整性
        run: |
          python3 scripts/docs_test.py
          scripts/work check

  go:
    name: judge-engine (Go)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/judge-engine
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/judge-engine/go.mod
          cache-dependency-path: apps/judge-engine/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未格式化，请跑 gofmt -w："
            echo "$unformatted"
            exit 1
          fi
      - name: 依赖同步
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: 静态检查与编译
        run: |
          go vet ./...
          go build ./...
      - name: 测试与竞态检查
        # 包间串行减少编译夹具的资源竞争，包内并发与 race 检查保留。
        run: go test -race -count=1 -p=1 ./...
      - name: 工具链版本
        if: always()
        # language 包在缺少工具链时会跳过对应测试，保留版本供核对。
        run: |
          g++ --version | head -1
          python3 --version
          java --version | head -1

  web:
    name: web (React SPA)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 安装锁定依赖
        run: npm ci
      - name: 生成物、格式、Lint、类型与组件测试
        run: npm run check
      - name: 生产构建
        run: npm run build

  java:
    name: server (Java)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/server
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/server/**/pom.xml
          overwrite-settings: false
      - name: 编译、测试与打包
        # 单服务数据库/消息测试使用 runner 的 Docker，真实 Linux 判题仍按需验证。
        run: ./mvnw -B -ntp clean verify

  sandbox:
    name: sandbox (C)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 安装编译依赖
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libseccomp-dev
      - name: 编译执行器
        run: make -C apps/sandbox
