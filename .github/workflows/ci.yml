name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支上新的 push 会取消还在跑的旧任务，别让队列堆着过时的结果
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sandbox-kernel:
    name: sandbox CI（Linux 隔离、计量与回收）
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/judge-engine/go.mod
          cache-dependency-path: apps/judge-engine/go.sum
      - name: 当前提交构建、Linux 单测与锁定 rootfs
        run: python3 deploy/sandbox-linux/ci/prepare.py --output "$RUNNER_TEMP/sandbox-build"
      - name: 真实内核、1000 次、并发与故障测试
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,ImageVersion,PYTHONDONTWRITEBYTECODE
          python3 deploy/sandbox-linux/ci/kernel.py
          --build "$RUNNER_TEMP/sandbox-build" --output "$RUNNER_TEMP/sandbox-kernel"
      - name: 取消或失败后的所有权清理
        if: always()
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,PYTHONDONTWRITEBYTECODE
          python3 deploy/sandbox-linux/ci/kernel.py --cleanup --output "$RUNNER_TEMP/sandbox-kernel"
      - name: 保存内核报告
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sandbox-kernel
          path: ${{ runner.temp }}/sandbox-kernel
          if-no-files-found: error
          retention-days: 14
      - name: 保存有界构建日志
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sandbox-kernel-build
          path: ${{ runner.temp }}/sandbox-build/logs
          if-no-files-found: error
          retention-days: 14

  sandbox-native:
    name: sandbox CI（原生安装、权限与服务恢复）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: apps/judge-engine/go.mod
          cache-dependency-path: apps/judge-engine/go.sum
      - name: 当前提交构建、Linux 单测与锁定 rootfs
        run: python3 deploy/sandbox-linux/ci/prepare.py --output "$RUNNER_TEMP/sandbox-build"
      - name: 原生安装与十项部署恢复验证
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,ImageVersion,PYTHONDONTWRITEBYTECODE
          python3 deploy/sandbox-linux/ci/native.py
          --build "$RUNNER_TEMP/sandbox-build" --output "$RUNNER_TEMP/sandbox-native"
      - name: 取消或失败后的所有权清理
        if: always()
        run: >-
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,GITHUB_RUN_ID,GITHUB_RUN_ATTEMPT,PYTHONDONTWRITEBYTECODE
          python3 deploy/sandbox-linux/ci/native.py --cleanup --output "$RUNNER_TEMP/sandbox-native"
      - name: 保存原生部署报告
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sandbox-native
          path: ${{ runner.temp }}/sandbox-native
          if-no-files-found: error
          retention-days: 14
      - name: 保存有界构建日志
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sandbox-native-build
          path: ${{ runner.temp }}/sandbox-build/logs
          if-no-files-found: error
          retention-days: 14

  sandbox-basic:
    name: sandbox CI（基础与证据校验）
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 部署与 rootfs 单测、脚本语法、报告正反例
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 deploy/sandbox-linux/ci/basic.py --output "$RUNNER_TEMP/sandbox-basic"
      - name: 保存有界报告
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sandbox-basic
          path: ${{ runner.temp }}/sandbox-basic
          if-no-files-found: error
          retention-days: 14

  # development/ 是统一工作项与开发文档真源；流程、引用或验证证据断链会让智能体拿到错误输入。
  development:
    name: 开发文档系统
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 工作项工具端到端测试
        run: python3 scripts/work_test.py
      - name: 校验元数据、流程、状态、引用与证据
        run: scripts/work check
      - name: 文档链接校验器测试
        run: python3 scripts/docs_test_test.py
      - name: 校验全局与开发文档入口和本地链接
        run: python3 scripts/docs_test.py

  web:
    name: web (React SPA)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: 安装锁定依赖
        run: npm ci

      - name: OpenAPI 漂移、格式、Lint、类型与组件测试
        run: npm run check

      - name: 生产构建
        run: npm run build

      - name: Storybook 静态构建
        run: npm run storybook:build

      - name: 安装 Chromium 与系统依赖
        run: npx playwright install --with-deps chromium

      - name: 浏览器 smoke
        run: npm run test:e2e

  # 跨服务 / 跨语言契约是共享 DTO 的唯一真源，语法、引用或安全边界坏掉会同时影响多侧，
  # 所以单独一个最快的 job 先把它挡住。
  contracts:
    name: contracts (结构与边界)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 校验 contracts/*.json 可解析
        run: |
          for f in contracts/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f" \
              || { echo "::error file=$f::JSON 解析失败"; exit 1; }
            echo "✓ $f"
          done
      - name: 校验 schema 引用、v2 字段和事件安全边界
        run: python3 scripts/contracts_test.py

  go:
    name: judge-engine (Go)
    runs-on: ubuntu-latest # sandbox 的目标平台就是 Linux，CI 也只在这里跑
    defaults:
      run:
        working-directory: apps/judge-engine
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # 从 go.mod 读版本，别在两处各写一遍版本号
          go-version-file: apps/judge-engine/go.mod
          cache-dependency-path: apps/judge-engine/go.sum

      # CLAUDE.md 里写的「提交前必须干净」，在这里变成强制的
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::以下文件未格式化，请跑 gofmt -w ："
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -race 是硬要求：pool 的并发用例在普通模式下可能几百次都不复现竞态。
      # 顺带 -count=1 关掉结果缓存，别让「上次绿过」冒充这次的结论。
      - name: go test (race)
        # 按包串行执行，减少包间资源竞争对可信功能夹具编译的影响。
        # 包内goroutine并发和race检查保留，全部包仍实际运行一次。
        run: go test -race -count=1 -p=1 ./...

      - name: 工具链自检
        if: always()
        # language 包的集成测试在缺工具链时会 t.Skip。
        # 这里显式打印一遍版本，免得某天镜像变了、测试静默跳过而没人发现。
        run: |
          g++ --version | head -1
          python3 --version
          java --version | head -1 || echo "!! 没有 java：language 的 e2e 会被跳过"

  # go.mod / go.sum 不同步会让别人 clone 下来跑不起来，但本地往往察觉不到
  tidy:
    name: go.mod 是否整洁
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/judge-engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: apps/judge-engine/go.mod
          cache-dependency-path: apps/judge-engine/go.sum
      - name: go mod tidy 后不应有改动
        run: |
          go mod tidy
          if ! git diff --exit-code -- go.mod go.sum; then
            echo "::error::go.mod / go.sum 与代码不同步，请在本地跑 go mod tidy 后提交"
            exit 1
          fi

  # Dockerfile 产出两个镜像，Compose 再验证它们确实能通过私网协作完成一次判题。
  # 这条同时钉住：运行时工具链、非 root / 只读文件系统、测试数据挂载和端口拓扑。
  containers:
    name: judge + sandbox（legacy 回退）
    runs-on: ubuntu-latest
    env:
      # 纯 Go smoke 不启动 Java 控制面；显式覆盖 legacy 回退，节点链路见 node-e2e.py。
      COMPOSE_FILE: compose.yaml:compose.legacy.yaml
      TESTDATA_PATH: ${{ github.workspace }}/apps/judge-engine/internal/judge/testcase/testdata
    steps:
      - uses: actions/checkout@v7

      - name: 校验 Compose 配置
        run: docker compose config --quiet

      - name: 构建 judge / sandbox 镜像
        run: docker compose build

      - name: A+B 容器联调
        run: |
          set -eu
          cleanup() {
            docker compose logs --no-color judge sandbox || true
            docker compose down
          }
          trap cleanup EXIT

          docker compose up -d --no-build --wait
          response=$(curl -sS -X POST http://127.0.0.1:5051/judge \
            -H 'Content-Type: application/json' \
            -d '{"submissionId":"ci-docker","problemId":"problem-a-plus-b","problemVersionId":"problem-a-plus-b-v1","testDataVersionId":"a-plus-b","languageId":"cpp","source":"#include <iostream>\nint main(){long long a,b;std::cin>>a>>b;std::cout<<a+b<<\"\\n\";}","limits":{"cpuNs":1000000000,"memoryBytes":268435456}}')
          echo "$response"
          printf '%s' "$response" | python3 -c '
          import json, sys
          result = json.load(sys.stdin)
          assert result["verdict"] == "AC", result
          assert result["environmentFingerprint"] == "local-compose", result
          assert len(result["caseResults"]) == 3, result
          assert all(case["verdict"] == "AC" for case in result["caseResults"]), result
          '
