# judge 单机冒烟：不启用节点链路，不需要 Java 控制面，测试数据从宿主机只读挂载。
# 与 compose.yaml 一起使用：COMPOSE_FILE=compose.yaml:compose.standalone.yaml。
services:
  judge:
    environment:
      CHERRY_OJ_JUDGE_NODE_ENABLED: "false"
    volumes:
      - type: bind
        source: ${TESTDATA_PATH:?standalone judge requires a testdata directory}
        target: /srv/cherry-oj/testdata
        read_only: true
